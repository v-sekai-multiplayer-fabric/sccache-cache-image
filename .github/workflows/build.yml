name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild to pick up upstream AlmaLinux + dnf updates.
    - cron: "0 6 * * 1"

permissions:
  contents: write   # to upload release assets

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install qemu + packer
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y packer
          packer version

      - name: Enable KVM access
        run: |
          sudo usermod -aG kvm "$USER"
          sudo chmod 666 /dev/kvm

      - name: Prepare cidata
        working-directory: packer
        run: bash scripts/prepare-cidata.sh

      - name: Packer init
        working-directory: packer
        run: packer init build.pkr.hcl

      - name: Packer build
        working-directory: packer
        env:
          PKR_VAR_version: ${{ github.ref_name }}
        run: sudo -E packer build build.pkr.hcl

      - name: Hash output
        working-directory: output
        run: |
          sha512sum sccache-cache-image.qcow2 > sccache-cache-image.qcow2.sha512
          ls -lh

      - name: Upload artifact (non-tag pushes)
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: sccache-cache-image-${{ github.sha }}
          path: |
            output/sccache-cache-image.qcow2
            output/sccache-cache-image.qcow2.sha512
          retention-days: 14

      - name: Upload to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "sccache-cache-image ${{ github.ref_name }}" \
            --notes "Automated build from ${{ github.sha }}." \
            output/sccache-cache-image.qcow2 \
            output/sccache-cache-image.qcow2.sha512 \
            || gh release upload "${{ github.ref_name }}" \
            output/sccache-cache-image.qcow2 \
            output/sccache-cache-image.qcow2.sha512 \
            --clobber
